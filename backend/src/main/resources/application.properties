spring.application.name=airbnbApis
server.port=${SERVER_PORT:3001}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/balinese_retreat}
spring.datasource.username=${DATABASE_USERNAME:retreat}
spring.datasource.password=${DATABASE_PASSWORD:retreat_dev_password}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
