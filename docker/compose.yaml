name: balinese-retreat

services:
  database:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Copy docker/.env.example to docker/.env}
      POSTGRES_USER: ${DATABASE_USERNAME:?Copy docker/.env.example to docker/.env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Copy docker/.env.example to docker/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      SERVER_PORT: 3001
      DATABASE_URL: jdbc:postgresql://database:5432/${DATABASE_NAME:?Copy docker/.env.example to docker/.env}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Copy docker/.env.example to docker/.env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Copy docker/.env.example to docker/.env}
      AIRBNB_ICAL_URL: ${AIRBNB_ICAL_URL:-}

    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 3s
      start_period: 25s
      retries: 5
    restart: unless-stopped

  website:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: production
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ../frontend/stay.html:/usr/share/nginx/html/stay.html:ro
      - ../frontend/amenities.html:/usr/share/nginx/html/amenities.html:ro
      - ../frontend/location.html:/usr/share/nginx/html/location.html:ro
      - ../frontend/availability.html:/usr/share/nginx/html/availability.html:ro
      - ../frontend/guide.html:/usr/share/nginx/html/guide.html:ro
      - ../frontend/styles.css:/usr/share/nginx/html/styles.css:ro
      - ../frontend/script.js:/usr/share/nginx/html/script.js:ro
      - ../frontend/calendar.js:/usr/share/nginx/html/calendar.js:ro
      - ../frontend/images:/usr/share/nginx/html/images:ro
    restart: unless-stopped

volumes:
  postgres-data:
