name: balinese-retreat

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: balinese_retreat
      POSTGRES_USER: balinese_retreat
      POSTGRES_PASSWORD: balinese_retreat
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balinese_retreat -d balinese_retreat"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      SERVER_PORT: 3001
      DATABASE_URL: jdbc:postgresql://database:5432/balinese_retreat
      DATABASE_USERNAME: balinese_retreat
      DATABASE_PASSWORD: balinese_retreat
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 3s
      start_period: 25s
      retries: 5
    restart: unless-stopped

  website:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: development
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../frontend/index.html:/app/index.html:ro
      - ../frontend/guide.html:/app/guide.html:ro
      - ../frontend/styles.css:/app/styles.css:ro
      - ../frontend/script.js:/app/script.js:ro
    restart: unless-stopped

volumes:
  postgres-data:
