services:
  api:
    build:
      context: ./backend
    container_name: balinese-retreat-api
    environment:
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ./backend/server.js:/app/server.js:ro
      - ./backend/data:/app/data:ro
    restart: unless-stopped

  website:
    build:
      context: .
      target: development
    container_name: balinese-retreat-website
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./index.html:/app/index.html:ro
      - ./guide.html:/app/guide.html:ro
      - ./styles.css:/app/styles.css:ro
      - ./script.js:/app/script.js:ro
    restart: unless-stopped
